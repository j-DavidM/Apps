<body>
<canvas id="gl" aria-label="3D pop-up paper map"></canvas>
<div id="labels" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><span class="mark"></span>Pop-up Hikes</div>
  <nav class="switch" id="hikeSwitch" role="tablist"></nav>
  <button class="refold" id="refold" title="Fold and unfold again" aria-label="Refold">↺<span> Refold</span></button>
</header>
<aside class="sheet" id="sheet" data-state="peek">
  <button class="grab" id="grab" aria-label="Resize sheet"><i></i></button>
  <div class="title"><span class="kicker" id="kicker"></span><h1 id="hikeName"></h1></div>
  <div class="routes" id="routes" role="tablist"></div>
  <div class="stats" id="stats"></div>
  <div class="stop" id="stop"></div>
  <div class="profile"><canvas id="profile" height="120"></canvas><div class="pread" id="pread"></div></div>
  <p class="pnote" id="pnote"></p>
  <details class="srcbox" id="srcs"><summary>ⓘ Sources &amp; notes</summary><p class="src" id="srcText"></p><p class="fine" id="fine"></p></details>
</aside>
<div class="hint" id="hint">Tap a red pin · drag to tilt</div>
</body>
